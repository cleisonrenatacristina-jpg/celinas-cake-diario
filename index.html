async function apiLoad(){
  try{
    const r=await fetch(`${SHEETS_URL}?action=load&sheet=diario`);
    const d=await r.json();
    if(d.ok&&d.orders?.length>0){
      // atualiza cache local
      try{localStorage.setItem("celinas-diario-orders",JSON.stringify(d.orders));}catch{}
      return d.orders;
    }
  }catch(e){}
  // fallback: usa cache local se offline
  try{const s=localStorage.getItem("celinas-diario-orders");return s?JSON.parse(s):[];}catch{return[];}
}
async function apiSave(orders){
  // salva no cache local imediatamente (funciona offline)
  try{localStorage.setItem("celinas-diario-orders",JSON.stringify(orders));}catch{}
  // salva no Google Sheets (sincroniza entre dispositivos)
  try{
    const p=new URLSearchParams();
    p.append("action","save");
    p.append("sheet","diario");
    p.append("orders",JSON.stringify(orders));
    await fetch(SHEETS_URL,{method:"POST",body:p});
  }catch(e){}
}
async function apiIA(msg){try{const p=new URLSearchParams();p.append("action","ia");p.append("msg",msg);const r=await fetch(SHEETS_URL,{method:"POST",body:p});const d=await r.json();if(d.ok)return JSON.parse(d.result);}catch(e){}return null;}

function WhatsAppPage({onSave}){
  const h=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const ini=[{s:"left",t:"Oi!! Quero fazer um pedido 😊",h:""},{s:"right",t:"Olá! Bem-vinda à Celina's Cake 🎂🌸\nQual seria o seu pedido?",h:h()}];
  const[msgs,setMsgs]=useState(()=>{try{const s=localStorage.getItem("celinas-diario-wa");return s?JSON.parse(s):ini;}catch{return ini;}});
  const[inp,setInp]=useState("");const[load,setLoad]=useState(false);const[prev,setPrev]=useState(null);const[copiado,setCopiado]=useState(false);
  const ref=useRef(null);

  useEffect(()=>{try{localStorage.setItem("celinas-diario-wa",JSON.stringify(msgs));}catch{}if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[msgs]);
  const limpar=()=>{setMsgs(ini);setPrev(null);try{localStorage.removeItem("celinas-diario-wa");}catch{}};

  const copiar=()=>{
    if(!prev)return;
    const dt=prev.data_retirada?new Date(prev.data_retirada+"T12:00").toLocaleDateString("pt-BR"):"—";
    const freteVal=parseFloat(prev.frete)||0;
    const totalVal=(prev.valor||0)+freteVal;
    let txt=`✅ *PEDIDO*\n👤 ${prev.cliente||"—"}\n📞 ${prev.telefone||"—"}\n🥚 ${prev.itens||"—"}\n💰 Produtos: ${prev.valor?fmt(prev.valor):"—"}`;
    if(freteVal>0)txt+=`\n🚚 Frete: ${fmt(freteVal)}\n💵 *Total: ${fmt(totalVal)}*`;
    txt+=`\n📅 ${prev.tipo_entrega==="entrega"?"Entrega":"Retirada"}: ${dt}`;
    if(prev.endereco)txt+=`\n📍 ${prev.endereco}`;
    navigator.clipboard.writeText(txt).then(()=>{setCopiado(true);setTimeout(()=>setCopiado(false),2000);});
  };

  const send=async()=>{
    if(!inp.trim()||load)return;
    const txt=inp.trim();setInp("");setMsgs(m=>[...m,{s:"left",t:txt,h:h()}]);setLoad(true);setPrev(null);
    const p=await apiIA(txt);
    if(p){
      const freteVal=parseFloat(p.frete)||0;
      const totalVal=(p.valor||0)+freteVal;
      setPrev({...p,frete:freteVal});
      const nome=p.cliente?`, ${p.cliente.split(" ")[0]}`:"";
      const dt=p.data_retirada?new Date(p.data_retirada+"T12:00").toLocaleDateString("pt-BR"):null;
      let r=`Anotado${nome}! 📝\n\n🥚 *${p.itens}*`;
      if(p.valor)r+=`\n💰 Produtos: ${fmt(p.valor)}`;
      if(freteVal>0)r+=`\n🚚 Frete: ${fmt(freteVal)}\n💵 *Total: ${fmt(totalVal)}*`;
      if(dt)r+=`\n📅 ${p.tipo_entrega==="entrega"?"Entrega":"Retirada"}: ${dt}`;
      if(p.endereco)r+=`\n📍 ${p.endereco}`;
      if(p.observacoes)r+=`\n📝 ${p.observacoes}`;
      r+=`\n\nConfirmo? ✅`;
      setMsgs(m=>[...m,{s:"right",t:r,h:h()}]);
    }
    else{setMsgs(m=>[...m,{s:"right",t:"Hmm, não entendi 😅 Pode detalhar?",h:h()}]);}
    setLoad(false);
  };

  const confirmar=()=>{
    if(!prev)return;
    onSave({...prev,valor:prev.valor||0,frete:parseFloat(prev.frete)||0});
    setMsgs(m=>[...m,{s:"left",t:"Sim! ✅",h:h()},{s:"right",t:"Confirmado! 🎉🎂 Obrigada! 💕",h:h()}]);
    setPrev(null);
  };

  return(
    <div style={{maxWidth:520,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div><h2 style={{margin:0,fontSize:18,color:RE}}>💬 Pedido via WhatsApp</h2><p style={{margin:"4px 0 0",fontSize:12,color:"#aaa"}}>Cole a mensagem e a IA cria o pedido</p></div>
        <button onClick={limpar} style={{padding:"6px 12px",borderRadius:10,border:`1.5px solid ${RM}`,background:"#fff",color:"#aaa",fontSize:11,cursor:"pointer"}}>🗑️ Limpar</button>
      </div>
      <div style={{borderRadius:18,overflow:"hidden",boxShadow:"0 6px 32px rgba(180,48,74,.15)"}}>
        <div style={{background:"#075e54",padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:"50%",overflow:"hidden"}}><img src={LOGO} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
          <div><div style={{color:"#fff",fontWeight:700,fontSize:14}}>Celina's Cake 🎂</div><div style={{color:"rgba(255,255,255,.6)",fontSize:11}}>🟢 online</div></div>
        </div>
        <div ref={ref} style={{background:"#ece5dd",padding:"16px 12px",minHeight:280,maxHeight:400,overflowY:"auto",display:"flex",flexDirection:"column"}}>
          {msgs.map((m,i)=><WaBubble key={i} msg={m.t} side={m.s} hora={m.h}/>)}
          {load&&<div style={{display:"flex",justifyContent:"flex-end"}}><div style={{background:"#dcf8c6",borderRadius:"18px 4px 18px 18px",padding:"10px 16px",fontSize:13,color:"#888"}}>digitando...</div></div>}
        </div>
        <div style={{background:"#f0f0f0",padding:"10px 12px",display:"flex",gap:8,alignItems:"flex-end"}}>
          <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Cole a mensagem do cliente..." rows={2} style={{flex:1,borderRadius:22,border:"none",padding:"10px 16px",fontSize:13,resize:"none",outline:"none",background:"#fff"}}/>
          <button onClick={send} disabled={load||!inp.trim()} style={{width:44,height:44,borderRadius:"50%",border:"none",background:load||!inp.trim()?"#ccc":"#25d366",color:"#fff",fontSize:20,cursor:load||!inp.trim()?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>➤</button>
        </div>
      </div>

      {prev&&(()=>{
        const freteVal=parseFloat(prev.frete)||0;
        const totalVal=(prev.valor||0)+freteVal;
        const dt=prev.data_retirada?new Date(prev.data_retirada+"T12:00").toLocaleDateString("pt-BR"):"—";
        const campos=[
          ["👤 Cliente",prev.cliente||"—"],
          ["📞 Telefone",prev.telefone||"—"],
          ["🥚 Produto",prev.itens||"—"],
          ["💰 Produtos",prev.valor?fmt(prev.valor):"—"],
          ["🚚 Frete",freteVal>0?fmt(freteVal):"Grátis"],
          ["📅 Data",dt],
          ["🚚 Tipo",prev.tipo_entrega==="entrega"?"Entrega":"Retirada"],
          ...(prev.endereco?[["📍 Endereço",prev.endereco]]:[]),
        ];
        return(
          <div style={{marginTop:16,background:"#fff",borderRadius:16,padding:20,border:`2px solid ${ROSA}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <h3 style={{margin:0,color:RE,fontSize:15}}>📋 Pedido interpretado</h3>
              <button onClick={copiar} style={{padding:"5px 12px",borderRadius:10,border:`1.5px solid ${RM}`,background:copiado?"#eaf5f1":"#fff",color:copiado?VE:"#aaa",fontSize:11,fontWeight:700,cursor:"pointer"}}>{copiado?"✅ Copiado!":"📋 Copiar"}</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              {campos.map(([k,v])=>(<div key={k} style={{background:k==="🚚 Frete"&&freteVal>0?"#fffbe6":RC,borderRadius:10,padding:"8px 12px",border:k==="🚚 Frete"&&freteVal>0?`1px solid ${AM}`:"none"}}><div style={{fontSize:10,color:"#aaa",marginBottom:2}}>{k}</div><div style={{fontWeight:700,fontSize:12,color:k==="🚚 Frete"&&freteVal>0?AM:"inherit"}}>{v}</div></div>))}
            </div>
            {freteVal>0&&(
              <div style={{background:`linear-gradient(135deg,${RC},#fff8f4)`,borderRadius:12,padding:"10px 14px",marginBottom:12,border:`1.5px solid ${RM}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:10,color:"#aaa",marginBottom:2}}>🍫 Produtos + 🚚 Frete</div>
                  <div style={{fontSize:11,color:"#888"}}>{fmt(prev.valor||0)} + {fmt(freteVal)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:10,color:"#aaa",marginBottom:2}}>💵 TOTAL</div>
                  <div style={{fontSize:18,fontWeight:700,color:RE}}>{fmt(totalVal)}</div>
                </div>
              </div>
            )}
            <div style={{display:"flex",gap:8}}>
              <button onClick={confirmar} style={{flex:1,padding:12,borderRadius:12,border:"none",background:`linear-gradient(135deg,${VE},#7abf9e)`,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>✅ Confirmar pedido</button>
              <button onClick={()=>setPrev(null)} style={{padding:"12px 14px",borderRadius:12,border:`1.5px solid #f0dde4`,background:"#fff",color:"#aaa",fontSize:13,cursor:"pointer"}}>✏️</button>
            </div>
          </div>
        );
      })()}

      <div style={{marginTop:14,background:"#fff8f4",borderRadius:14,padding:14,border:"1px solid #f0dde4"}}>
        <div style={{fontSize:11,color:"#aaa",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>⚡ Exemplos</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {[
            "Oi! Quero 2 ovos ao leite 250g pra retirar dia 15/04. Sou a Maria.",
            "Bom dia! Ana aqui, quero Ovo Fatia 700g pra sábado 19/04.",
            "Sou o João, quero 50 brigadeiros ao leite pra entregar dia 20/04 na Rua das Rosas 10. Frete R$15.",

    </div>

}

function PrecosPage({cardapio,precos,setPrecos,extrasCardapio,setExtrasCardapio,acessoriosBase=[],setAcessoriosBase}){
  const[catF,setCatF]=useState("Todas");
  const[busca,setBusca]=useState("");
  const[saved,setSaved]=useState(false);
  const[aba,setAba]=useState("precos");
  const[novoAcessNome,setNovoAcessNome]=useState("");
  const[novoAcessPreco,setNovoAcessPreco]=useState("");
  const[novoAcessIcon,setNovoAcessIcon]=useState("🎁");
  const[novoNome,setNovoNome]=useState("");
  const[novoPreco,setNovoPreco]=useState("");
  const[novaCat,setNovaCat]=useState("");
  const[novaObs,setNovaObs]=useState("");
  const[novaUnidade,setNovaUnidade]=useState("un");
  const[catCustom,setCatCustom]=useState("");
  const[errNovo,setErrNovo]=useState("");

  const catsBase=Array.from(new Set(CAD_BASE.map(p=>p.cat)));
  const catsExtras=Array.from(new Set((extrasCardapio||[]).map(p=>p.cat)));
  const todasCats=["Todas",...Array.from(new Set([...catsBase,...catsExtras]))];

  const fil=cardapio.filter(p=>(catF==="Todas"||p.cat===catF)&&p.nome.toLowerCase().includes(busca.toLowerCase()));

  const upd=(nome,val)=>{const v=parseFloat(val);if(!isNaN(v)&&v>=0){setPrecos(p=>({...p,[nome]:v}));setSaved(true);setTimeout(()=>setSaved(false),2000);}};
  const reaj=pct=>{const n={...precos};fil.forEach(p=>{n[p.nome]=parseFloat((p.preco*(1+pct/100)).toFixed(2));});setPrecos(n);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const resetFil=()=>{const n={...precos};fil.forEach(p=>{const o=CAD_BASE.find(x=>x.nome===p.nome);if(o)n[p.nome]=o.preco;});setPrecos(n);};

  const catFinal=novaCat==="__nova__"?catCustom.trim():novaCat;

  const addProduto=()=>{
    if(!novoNome.trim())return setErrNovo("Informe o nome do produto.");
    if(!novoPreco||isNaN(parseFloat(novoPreco)))return setErrNovo("Informe um preço válido.");
    // se for acessório, salva direto em acessoriosBase
    if(novaUnidade==="acessorio"){
      const novoAcess={id:"a"+Date.now(),nome:novoNome.trim(),preco:parseFloat(novoPreco),icon:novaObs.trim()||"🎁"};
      if(typeof setAcessoriosBase==="function") setAcessoriosBase(prev=>[...prev,novoAcess]);
      setNovoNome("");setNovoPreco("");setNovaCat("");setNovaObs("");setNovaUnidade("un");setCatCustom("");setErrNovo("");
      setSaved(true);setTimeout(()=>setSaved(false),2000);
      setAba("acessorios");
      return;
    }
    if(!catFinal)return setErrNovo("Selecione ou crie uma categoria.");
    if(cardapio.find(p=>p.nome.toLowerCase()===novoNome.trim().toLowerCase()))return setErrNovo("Já existe um produto com esse nome.");
    const novo={cat:catFinal,nome:novoNome.trim(),preco:parseFloat(novoPreco),obs:novaObs.trim(),unidade:novaUnidade,_extra:true};
    setExtrasCardapio(prev=>[...prev,novo]);
    setPrecos(prev=>({...prev,[novo.nome]:novo.preco}));
    setNovoNome("");setNovoPreco("");setNovaCat("");setNovaObs("");setNovaUnidade("un");setCatCustom("");setErrNovo("");
    setSaved(true);setTimeout(()=>setSaved(false),2000);
    setAba("precos");
  };

  const delExtra=(nome)=>{
    const isBase=!!CAD_BASE.find(p=>p.nome===nome);
    const msg=isBase
      ?`Ocultar "${nome}" do cardápio? (Produto original do sistema — será ocultado mas não excluído permanentemente)`
      :`Remover "${nome}" do cardápio?`;
    if(!window.confirm(msg))return;
    if(isBase){
      // Produto base: adiciona na lista de ocultos
      setExtrasCardapio(prev=>{
        const jaOculto=prev.find(p=>p.nome===nome&&p._oculto);
        return jaOculto?prev:[...prev,{nome,cat:"__oculto__",_oculto:true}];
      });
    } else {
      setExtrasCardapio(prev=>prev.filter(p=>p.nome!==nome));
    }
    setPrecos(prev=>{const n={...prev};delete n[nome];return n;});
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };

  const delCategoria=(cat)=>{
    const prodsCat=cardapio.filter(p=>p.cat===cat);
    const temBase=prodsCat.some(p=>!extrasCardapio.find(e=>e.nome===p.nome));
    const msg=temBase
      ?`Excluir a categoria "${cat}" e todos os seus produtos personalizados? (Produtos originais do sistema não serão removidos, apenas ficarão sem categoria visível)`
      :`Excluir a categoria "${cat}" e todos os seus ${prodsCat.length} produto(s)?`;
    if(!window.confirm(msg))return;
    // remove apenas extras dessa categoria
    setExtrasCardapio(prev=>prev.filter(p=>p.cat!==cat));
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };

  return(
    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{margin:0,fontSize:20,color:RE}}>🍫 Cardápio & Preços</h2>
          <p style={{margin:"4px 0 0",fontSize:12,color:"#aaa"}}>{cardapio.length} produto(s) · {(extrasCardapio||[]).length} adicionado(s) por você</p>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          {saved&&<span style={{fontSize:12,color:VE,fontWeight:700}}>✅ Salvo!</span>}
          <button onClick={()=>setAba(aba==="acessorios"?"precos":"acessorios")} style={{padding:"8px 14px",borderRadius:22,border:`2px solid ${aba==="acessorios"?ROSA:RM}`,background:aba==="acessorios"?ROSA:"#fff",color:aba==="acessorios"?"#fff":ROSA,fontSize:12,fontWeight:700,cursor:"pointer"}}>
            {aba==="acessorios"?"← Voltar":"🎀 Acessórios"}
          </button>
          <button onClick={()=>setAba(aba==="novo"?"precos":"novo")} style={{padding:"8px 16px",borderRadius:22,border:`2px solid ${aba==="novo"?RE:RM}`,background:aba==="novo"?RE:"#fff",color:aba==="novo"?"#fff":RE,fontSize:12,fontWeight:700,cursor:"pointer"}}>
            {aba==="novo"?"← Voltar":"＋ Novo Produto"}
          </button>
        </div>
      </div>

      {aba==="acessorios"&&(
        <div style={{background:"#fff",borderRadius:18,padding:24,boxShadow:"0 4px 24px rgba(180,48,74,.10)",marginBottom:20,border:`2px solid ${RM}`}}>
          <h3 style={{margin:"0 0 18px",color:ROSA,fontSize:16}}>🎀 Gerenciar Acessórios & Extras</h3>
          <p style={{fontSize:12,color:"#aaa",marginBottom:16}}>Esses itens aparecem no pedido para personalizar bolos e outros produtos.</p>

          {/* Lista de acessórios */}
          <div style={{marginBottom:20}}>
            {acessoriosBase.map((a,i)=>(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:12,background:i%2===0?"#fdf9fb":"#fff",border:`1.5px solid ${RM}`,marginBottom:8}}>
                <span style={{fontSize:22}}>{a.icon||"🎁"}</span>
                <div style={{flex:1}}>
                  <input value={a.nome} onChange={e=>setAcessoriosBase(prev=>prev.map(x=>x.id===a.id?{...x,nome:e.target.value}:x))}
                    style={{border:"none",background:"transparent",fontSize:13,fontWeight:600,color:"#333",outline:"none",width:"100%"}}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:4,background:RC,borderRadius:9,padding:"5px 10px",border:`1.5px solid ${RM}`}}>
                  <span style={{fontSize:11,color:"#aaa"}}>R$</span>
                  <input type="number" step="0.01" min="0" value={a.preco}
                    onChange={e=>setAcessoriosBase(prev=>prev.map(x=>x.id===a.id?{...x,preco:parseFloat(e.target.value)||0}:x))}
                    style={{width:60,border:"none",background:"transparent",fontSize:14,fontWeight:700,color:RE,outline:"none",textAlign:"right"}}/>
                </div>
                <button onClick={()=>setAcessoriosBase(prev=>prev.filter(x=>x.id!==a.id))}
                  style={{padding:"5px 8px",borderRadius:8,border:"1.5px solid #ffd0cc",background:"#fff5f4",color:"#e07070",fontSize:13,cursor:"pointer"}}>🗑️</button>
              </div>
            ))}
          </div>

          {/* Adicionar novo acessório */}
          <div style={{background:RC,borderRadius:14,padding:"16px 18px",border:`1.5px solid ${RM}`}}>
            <div style={{fontWeight:700,fontSize:13,color:ROSA,marginBottom:12}}>➕ Novo acessório</div>
            <div style={{display:"grid",gridTemplateColumns:"auto 1fr auto",gap:10,alignItems:"end",flexWrap:"wrap"}}>
              <div>
                <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Ícone</label>
                <input value={novoAcessIcon} onChange={e=>setNovoAcessIcon(e.target.value)}
                  style={{width:52,padding:"9px 8px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:20,textAlign:"center",outline:"none"}}/>
              </div>
              <div>
                <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Nome *</label>
                <input value={novoAcessNome} onChange={e=>setNovoAcessNome(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&document.getElementById("btn-add-acess").click()}
                  placeholder="Ex: Topo de Bolo Personalizado"
                  style={{width:"100%",padding:"9px 12px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
              </div>
              <div>
                <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Preço (R$)</label>
                <div style={{display:"flex",alignItems:"center",gap:4,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${AM}`,background:"#fffbe6"}}>
                  <span style={{fontSize:11,color:AM}}>R$</span>
                  <input type="number" step="0.01" min="0" value={novoAcessPreco} onChange={e=>setNovoAcessPreco(e.target.value)}
                    onKeyDown={e=>e.key==="Enter"&&document.getElementById("btn-add-acess").click()}
                    placeholder="0,00"
                    style={{width:70,border:"none",background:"transparent",fontSize:14,fontWeight:700,color:AM,outline:"none"}}/>
                </div>
              </div>
            </div>
            <button id="btn-add-acess" onClick={()=>{
              if(!novoAcessNome.trim()||!novoAcessPreco)return;
              setAcessoriosBase(prev=>[...prev,{id:"a"+Date.now(),nome:novoAcessNome.trim(),preco:parseFloat(novoAcessPreco)||0,icon:novoAcessIcon||"🎁"}]);
              setNovoAcessNome("");setNovoAcessPreco("");setNovoAcessIcon("🎁");
              setSaved(true);setTimeout(()=>setSaved(false),2000);
            }} disabled={!novoAcessNome.trim()||!novoAcessPreco}
              style={{marginTop:12,width:"100%",padding:11,borderRadius:10,border:"none",background:novoAcessNome.trim()&&novoAcessPreco?`linear-gradient(135deg,${ROSA},${RE})`:"#ccc",color:"#fff",fontSize:13,fontWeight:700,cursor:novoAcessNome.trim()&&novoAcessPreco?"pointer":"not-allowed"}}>
              ✅ Adicionar Acessório
            </button>
          </div>
        </div>
      )}

      {aba==="novo"&&(
        <div style={{background:"#fff",borderRadius:18,padding:24,boxShadow:"0 4px 24px rgba(180,48,74,.10)",marginBottom:20,border:`2px solid ${RM}`}}>
          <h3 style={{margin:"0 0 18px",color:RE,fontSize:16}}>✨ Adicionar novo produto ao cardápio</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
            <div style={{gridColumn:"1/-1"}}>
              <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Nome do produto *</label>
              <input value={novoNome} onChange={e=>setNovoNome(e.target.value)} placeholder="Ex: Ovo Recheado Especial 300g" style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
            </div>
            <div>
              <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Preço (R$) *</label>
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${RM}`,background:RC}}>
                <span style={{color:"#aaa",fontSize:12}}>R$</span>
                <input type="number" step="0.01" min="0" value={novoPreco} onChange={e=>setNovoPreco(e.target.value)} placeholder="0,00" style={{flex:1,border:"none",background:"transparent",fontSize:14,fontWeight:700,color:RE,outline:"none"}}/>
              </div>
            </div>
            <div>
              <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>{novaUnidade==="acessorio"?"Emoji / Ícone":"Observação / Sabores"}</label>
              <input value={novaObs} onChange={e=>setNovaObs(e.target.value)} placeholder={novaUnidade==="acessorio"?"Ex: 🎂 🎀 🕯️ (coloque um emoji)":"Ex: Disponível em 3 sabores"} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
            </div>
            <div>
              <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Unidade de Venda *</label>
              <div style={{display:"flex",gap:8}}>
                {[{v:"un",l:"🔢 Por unidade/qtd"},{v:"kg",l:"⚖️ Por kg (peso)"},{v:"acessorio",l:"🎀 Acessório/Extra"}].map(u=>(
                  <button key={u.v} type="button" onClick={()=>setNovaUnidade(u.v)} style={{flex:1,padding:"9px 8px",borderRadius:10,border:"1.5px solid",borderColor:novaUnidade===u.v?RE:"#f0dde4",background:novaUnidade===u.v?RC:"#fff",color:novaUnidade===u.v?RE:"#aaa",fontSize:12,fontWeight:700,cursor:"pointer"}}>{u.l}</button>
                ))}
              </div>
              {novaUnidade==="kg"&&<div style={{marginTop:6,fontSize:11,color:AM,background:"#fff8ec",padding:"6px 10px",borderRadius:8,border:`1px solid ${AM}`}}>⚖️ O cliente informará o peso (kg) na hora do pedido e o valor será calculado automaticamente.</div>}
              {novaUnidade==="acessorio"&&<div style={{marginTop:6,fontSize:11,color:ROSA,background:RC,padding:"6px 10px",borderRadius:8,border:`1px solid ${RM}`}}>🎀 Será salvo como Acessório/Extra e aparecerá na hora de criar pedidos para personalizar bolos e outros produtos. Use o campo "Emoji/Ícone" para escolher um emoji.</div>}
            </div>
            {novaUnidade!=="acessorio"&&<div style={{gridColumn:"1/-1"}}>
              <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Categoria *</label>
              <select value={novaCat} onChange={e=>setNovaCat(e.target.value)} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",color:novaCat?"#333":"#aaa",background:"#fff",marginBottom:8}}>
                <option value="">— Selecione uma categoria —</option>
                {[...catsBase,...catsExtras.filter(c=>!catsBase.includes(c))].map(c=><option key={c} value={c}>{c}</option>)}
                <option value="__nova__">✨ Criar nova categoria...</option>
              </select>
              {novaCat==="__nova__"&&(
                <input value={catCustom} onChange={e=>setCatCustom(e.target.value)} placeholder="Nome da nova categoria" style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${AM}`,fontSize:13,outline:"none",boxSizing:"border-box",background:"#fffbe6"}}/>
              )}
            </div>}
          </div>
          {errNovo&&<div style={{background:"#fff0f0",border:"1.5px solid #e07070",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#e05555",marginBottom:12}}>⚠️ {errNovo}</div>}
          {novoNome&&novoPreco&&catFinal&&(
            <div style={{background:RC,borderRadius:12,padding:"12px 14px",marginBottom:14,border:`1.5px solid ${RM}`}}>
              <div style={{fontSize:10,color:"#aaa",marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>👁 Preview</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontWeight:700,fontSize:14}}>{novoNome}</div>{novaObs&&<div style={{fontSize:11,color:"#aaa",marginTop:2}}>{novaObs}</div>}<div style={{fontSize:11,color:ROSA,marginTop:2}}>📂 {catFinal}</div></div>
                <div style={{fontSize:18,fontWeight:700,color:RE}}>{fmt(parseFloat(novoPreco)||0)}</div>
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            <button onClick={addProduto} style={{flex:1,padding:13,borderRadius:12,border:"none",background:`linear-gradient(135deg,${RE},${ROSA})`,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>✅ Adicionar ao cardápio</button>
            <button onClick={()=>{setNovoNome("");setNovoPreco("");setNovaCat("");setNovaObs("");setNovaUnidade("un");setCatCustom("");setErrNovo("");}} style={{padding:"13px 16px",borderRadius:12,border:`1.5px solid ${RM}`,background:"#fff",color:"#aaa",fontSize:13,cursor:"pointer"}}>🗑️</button>
          </div>
        </div>
      )}

      {aba==="precos"&&(<>
        <div style={{display:"flex",gap:6,alignItems:"center",background:"#fff",borderRadius:12,padding:"8px 14px",border:`1.5px solid ${RM}`,marginBottom:12,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:"#888"}}>Reajuste filtro:</span>
          {[-10,-5,5,10].map(p=>(
            <button key={p} onClick={()=>reaj(p)} style={{padding:"4px 10px",borderRadius:8,border:"1.5px solid",borderColor:p<0?"#e07070":VE,background:p<0?"#fff5f4":"#eaf5f1",color:p<0?"#e07070":VE,fontSize:11,fontWeight:700,cursor:"pointer"}}>{p>0?"+":""}{p}%</button>
          ))}
          <button onClick={resetFil} style={{padding:"4px 10px",borderRadius:8,border:`1.5px solid ${RM}`,background:"#fff",color:"#aaa",fontSize:11,cursor:"pointer"}}>↩️ Original</button>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar produto..." style={{padding:"8px 14px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",minWidth:200,flex:1}}/>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {todasCats.map(c=>(
              <button key={c} onClick={()=>setCatF(c)} style={{padding:"5px 12px",borderRadius:20,border:"2px solid",borderColor:catF===c?RE:"#f0dde4",background:catF===c?RE:"#fff",color:catF===c?"#fff":"#888",fontSize:11,fontWeight:700,cursor:"pointer"}}>{c}</button>
            ))}
          </div>
        </div>
        {[...catsBase,...catsExtras.filter(c=>!catsBase.includes(c))].filter(cat=>catF==="Todas"||catF===cat).map(cat=>{
          const items=fil.filter(p=>p.cat===cat);
          if(!items.length)return null;
          const temExtras=items.some(p=>(extrasCardapio||[]).find(e=>e.nome===p.nome));
          return(
            <div key={cat} style={{background:"#fff",borderRadius:16,marginBottom:14,overflow:"hidden",boxShadow:"0 2px 12px rgba(180,48,74,.07)"}}>
              <div style={{background:temExtras?"linear-gradient(135deg,#7a5c9b,#b07ad4)":`linear-gradient(135deg,${RE},${ROSA})`,padding:"11px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                <span style={{color:"#fff",fontWeight:700,fontSize:14}}>{cat}{temExtras?" ✨":""}</span>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{color:"rgba(255,255,255,.7)",fontSize:11}}>{items.length} produto(s)</span>
                  <button onClick={()=>{setAba("novo");setNovaCat(cat);}} title="Adicionar produto nesta categoria"
                    style={{padding:"3px 10px",borderRadius:20,border:"1.5px solid rgba(255,255,255,.5)",background:"rgba(255,255,255,.2)",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                    ＋ Produto
                  </button>
                  <button onClick={()=>delCategoria(cat)} title="Excluir categoria"
                    style={{padding:"3px 8px",borderRadius:20,border:"1.5px solid rgba(255,100,100,.6)",background:"rgba(220,50,50,.25)",color:"#ffcccc",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                    🗑️
                  </button>
                </div>
              </div>
              {items.map((p,i)=>{
                const isExtra=!!(extrasCardapio||[]).find(e=>e.nome===p.nome);
                const orig=CAD_BASE.find(x=>x.nome===p.nome)?.preco;
                const alt=!isExtra&&orig&&p.preco!==orig;
                return(
                  <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 18px",borderBottom:i<items.length-1?"1px solid #fce4ec":"none",gap:12,background:isExtra?"#f5f0ff":alt?"#fffbe6":"#fff"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:13,fontWeight:600}}>{p.nome}</span>
                        {isExtra&&<span style={{padding:"1px 7px",borderRadius:20,background:"#ede0ff",color:"#7a5c9b",fontSize:10,fontWeight:700}}>✨ novo</span>}
                      </div>
                      {p.obs&&<div style={{fontSize:11,color:"#aaa",marginTop:1}}>{p.obs}</div>}
                      {alt&&<div style={{fontSize:10,color:AM}}>Original: {fmt(orig||0)}</div>}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{display:"flex",gap:6,alignItems:"center"}}>
                        {(p.unidade||"un")==="kg"&&<span style={{padding:"2px 7px",borderRadius:20,background:"#fff8ec",color:AM,fontSize:10,fontWeight:700,border:`1px solid ${AM}`}}>⚖️/kg</span>}
                        <div style={{display:"flex",alignItems:"center",gap:4,background:isExtra?"#ede0ff":RC,borderRadius:10,padding:"6px 12px",border:`1.5px solid ${isExtra?"#c4a0e8":RM}`}}>
                          <span style={{fontSize:12,color:"#aaa"}}>R$</span>
                          <input type="number" step="0.01" min="0" defaultValue={p.preco} key={p.preco} onBlur={e=>upd(p.nome,e.target.value)} style={{width:70,border:"none",background:"transparent",fontSize:14,fontWeight:700,color:isExtra?"#7a5c9b":RE,outline:"none",textAlign:"right"}}/>
                          {(p.unidade||"un")==="kg"&&<span style={{fontSize:10,color:"#aaa"}}>/kg</span>}
                        </div>
                      </div>
                      {alt&&!isExtra&&<button onClick={()=>{if(orig)setPrecos(prev=>({...prev,[p.nome]:orig}));}} style={{padding:"4px 8px",borderRadius:8,border:"1.5px solid #f0dde4",background:"#fff",color:"#aaa",fontSize:11,cursor:"pointer"}}>↩️</button>}
                      <button onClick={()=>delExtra(p.nome)} style={{padding:"4px 8px",borderRadius:8,border:"1.5px solid #ffd0cc",background:"#fff5f4",color:"#e07070",fontSize:13,cursor:"pointer"}} title={isExtra?"Remover produto":"Ocultar produto do cardápio"}>🗑️</button>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </>)}
    </>
  );
}


function PagBtn({order,onUpdate}){
  const[modo,setModo]=useState(null);const[ent,setEnt]=useState(order.entrada||"");

function parseParte(parte) {
  parte = parte.trim();
  if (!parte) return null;
  var space = parte.indexOf(" ");
  if (space > 0) {
    var first = parte.slice(0, space).toLowerCase();
    if (first.slice(-1) === "x" && !isNaN(parseInt(first))) {
      return {qty: parseInt(first) || 1, nome: parte.slice(space+1).trim()};
    }
  }
  return {qty: 1, nome: parte};
}

}
function saveUsuarios(lista){
  try{localStorage.setItem(USUARIOS_KEY,JSON.stringify(lista));}catch{}
}
function getSession(){
  try{const s=sessionStorage.getItem(SESSION_KEY);return s?JSON.parse(s):null;}catch{return null;}
}
function saveSession(user){
  try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(user));}catch{}
}
function clearSession(){
  try{sessionStorage.removeItem(SESSION_KEY);}catch{}
}

  const[confirmDel,setConfirmDel]=useState(null);
  const[showSenhas,setShowSenhas]=useState({});
  const[saved,setSaved]=useState(false);

  const salvar=(novaLista)=>{
    setLista(novaLista);
    saveUsuarios(novaLista);
    setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  };

  const adicionar=()=>{
    if(!novoUser.usuario.trim())return setErro("Informe o nome do usuário.");
    if(!novoUser.senha.trim())return setErro("Informe a senha.");
    if(lista.find(u=>u.usuario.toLowerCase()===novoUser.usuario.toLowerCase().trim()))return setErro("Já existe um usuário com esse nome.");
    salvar([...lista,{usuario:novoUser.usuario.trim(),senha:novoUser.senha.trim(),role:"user"}]);
    setNovoUser({usuario:"",senha:""});
    setErro("");

  const remover=(usuario)=>{
    if(usuario===ADMIN_MASTER.usuario)return;
    salvar(lista.filter(u=>u.usuario!==usuario));
    setConfirmDel(null);
  };

  const atualizarSenha=(usuario,novaSenha)=>{
    salvar(lista.map(u=>u.usuario===usuario?{...u,senha:novaSenha}:u));

        <div style={{marginBottom:20}}>

  // Tradicional: 100% do peso = chocolate (ex: 250g → 250g choc)
  // Clássico: 70% do peso = chocolate (ex: 250g → 175g choc)
  // Coração: 100% do peso
  // Ovo Fatia 700g: 6 fatias × 70g = 420g choc
  // Ovo de Colher 500g: 50% = 250g choc
  // Ovo Frito 60g: 60g choc

  const calcChocolate=(nome,qty)=>{
    const n=nome.toLowerCase();
    // extrai peso em gramas do nome (ex: "250g" → 250)
    const mPeso=n.match(/(\d+)\s*g/);
    const peso=mPeso?parseInt(mPeso[1]):0;
    // detecta tipo
    const isLeite=n.includes("ao leite");
    const isBranco=n.includes("branco");
    const isMisto=n.includes("misto");
    const isZero=n.includes("zero");

    let leite=0,branco=0,zero=0;

    const add=(gTotal)=>{
      if(isZero){zero+=gTotal;}
      else if(isLeite){leite+=gTotal;}
      else if(isBranco){branco+=gTotal;}
      else if(isMisto){leite+=gTotal/2;branco+=gTotal/2;}
    };

    // Ovo Fatia 700g → 6 × 70g = 420g por unidade
    if(n.includes("fatia")){
      // sabores variados → ao leite por padrão (não há variação de tipo no nome)
      leite+=420*qty;
      return{leite,branco,zero};
    }
    // Ovo de Colher → 50% do peso
    if(n.includes("colher")&&peso>0){
      add(peso*0.5*qty);return{leite,branco,zero};
    }
    // Ovo Frito
    if(n.includes("frito")&&peso>0){
      add(peso*qty);return{leite,branco,zero};
    }
    // Ovo Tablet
    if(n.includes("tablet")&&peso>0){
      add(peso*qty);return{leite,branco,zero};
    }
    // Clássico → 70% do peso
    if(n.includes("clássico")||n.includes("classico")){
      if(peso>0){add(peso*0.7*qty);}
      return{leite,branco,zero};
    }
    // Tradicional, Coração, Colorê, Kit, Trio, Torta de Limão etc → 100%
    if(peso>0){
      add(peso*qty);
    }
    return{leite,branco,zero};
  };

                    <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>🍫 TOTAL DE CHOCOLATE (todos os tipos)</div>
                    <div style={{fontSize:32,fontWeight:700,color:RE,lineHeight:1}}>{(totalG/1000).toFixed(3)} <span style={{fontSize:16}}>kg</span></div>
                  </div>
                  <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#aaa",marginBottom:2}}>⏳ Ainda precisa</div>
                      <div style={{fontSize:20,fontWeight:700,color:RE}}>{(pendG/1000).toFixed(3)} kg</div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#aaa",marginBottom:2}}>✅ Já entregue</div>
                      <div style={{fontSize:20,fontWeight:700,color:"#888"}}>{(entG/1000).toFixed(3)} kg</div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Tabela detalhada por produto */}
            {detalhe.length===0?(
              <div style={{background:"#fff",borderRadius:16,padding:"50px 20px",textAlign:"center",color:"#ccc"}}>
                <div style={{fontSize:48,marginBottom:12}}>🍫</div>
                <div>Nenhum pedido cadastrado ainda</div>
              </div>
            ):(
              <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 12px rgba(180,48,74,.08)"}}>
                <div style={{background:`linear-gradient(135deg,#7b4f2e,#c8906a)`,padding:"12px 16px",display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px",gap:6,alignItems:"center"}}>
                  {["Produto","🍫 Ao Leite","🤍 Branco","💚 Zero","📦 Total pend."].map((h,i)=>(
                    <div key={i} style={{color:"#fff",fontSize:10,fontWeight:700,textAlign:i===0?"left":"center",opacity:.95}}>{h}</div>
                  ))}
                </div>
                {detalhe.map((p,i)=>{
                  const pend=p.leite+p.branco+p.zero;
                  const entregue=p.entregue_leite+p.entregue_branco+p.entregue_zero;
                  const total=pend+entregue;
                  const pct=total>0?Math.round(entregue/total*100):0;
                  return(
                    <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px",gap:6,alignItems:"center",padding:"11px 16px",borderBottom:"1px solid #fce4ec",background:i%2===0?"#fff":"#fdf9fb",borderLeft:`4px solid ${pend===0?"#ccc":pend<200?AM:"#7b4f2e"}`}}>
                      <div>
                        <div style={{fontSize:12,fontWeight:600,marginBottom:2}}>{p.nome}</div>
                        <div style={{height:4,borderRadius:2,background:"#f0dde4",overflow:"hidden"}}>
                          <div style={{height:"100%",borderRadius:2,width:pct+"%",background:pct===100?VE:AM}}/>
                        </div>
                        <div style={{fontSize:9,color:"#bbb",marginTop:1}}>{pct}% entregue</div>
                      </div>
                      <div style={{textAlign:"center",fontSize:12,color:p.leite>0?"#7b4f2e":"#ddd",fontWeight:p.leite>0?700:400}}>
                        {p.leite>0?(p.leite>=1000?(p.leite/1000).toFixed(2)+"kg":p.leite.toFixed(0)+"g"):"—"}
                      </div>
                      <div style={{textAlign:"center",fontSize:12,color:p.branco>0?"#b8860b":"#ddd",fontWeight:p.branco>0?700:400}}>
                        {p.branco>0?(p.branco>=1000?(p.branco/1000).toFixed(2)+"kg":p.branco.toFixed(0)+"g"):"—"}
                      </div>
                      <div style={{textAlign:"center",fontSize:12,color:p.zero>0?"#3a7a5a":"#ddd",fontWeight:p.zero>0?700:400}}>
                        {p.zero>0?(p.zero>=1000?(p.zero/1000).toFixed(2)+"kg":p.zero.toFixed(0)+"g"):"—"}
                      </div>
                      <div style={{textAlign:"center"}}>
                        {pend===0
                          ?<span style={{padding:"2px 7px",borderRadius:20,background:"#eaf5f1",color:VE,fontSize:11,fontWeight:700}}>✅</span>
                          :<span style={{padding:"2px 7px",borderRadius:20,background:"#fdf3ec",color:"#7b4f2e",fontSize:12,fontWeight:700}}>
                            {pend>=1000?(pend/1000).toFixed(2)+"kg":pend.toFixed(0)+"g"}
                          </span>
                        }
                      </div>
                    </div>
                  );
                })}
                {/* Rodapé totais */}
                {(()=>{
                  const tL=detalhe.reduce((s,p)=>s+p.leite,0);
                  const tB=detalhe.reduce((s,p)=>s+p.branco,0);
                  const tZ=detalhe.reduce((s,p)=>s+p.zero,0);
                  const tP=tL+tB+tZ;
                  const fmtG=g=>g>=1000?(g/1000).toFixed(3)+"kg":g.toFixed(0)+"g";
                  return(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px",gap:6,alignItems:"center",padding:"12px 16px",background:`linear-gradient(135deg,${RC},#fff8f4)`,borderTop:`2px solid ${RM}`}}>
                      <div style={{fontSize:12,fontWeight:700,color:RE}}>TOTAL PENDENTE</div>
                      <div style={{textAlign:"center",fontWeight:700,fontSize:12,color:"#7b4f2e"}}>{tL>0?fmtG(tL):"—"}</div>
                      <div style={{textAlign:"center",fontWeight:700,fontSize:12,color:"#b8860b"}}>{tB>0?fmtG(tB):"—"}</div>
                      <div style={{textAlign:"center",fontWeight:700,fontSize:12,color:"#3a7a5a"}}>{tZ>0?fmtG(tZ):"—"}</div>
                      <div style={{textAlign:"center"}}>
                        {tP===0
                          ?<span style={{padding:"2px 8px",borderRadius:20,background:"#eaf5f1",color:VE,fontSize:11,fontWeight:700}}>✅ OK</span>
                          :<span style={{padding:"2px 8px",borderRadius:20,background:RC,color:RE,fontSize:12,fontWeight:700}}>{fmtG(tP)}</span>
                        }
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* Legenda dos cálculos */}
            <div style={{marginTop:14,background:"#fff",borderRadius:12,padding:"14px 16px",border:`1px solid ${RM}`}}>
              <div style={{fontSize:11,color:"#aaa",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>📐 Como é calculado:</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:6}}>
                {[
                  ["Tradicional 250/500/800g","100% do peso = chocolate"],
                  ["Clássico 250/500/800g","70% do peso = chocolate"],
                  ["Coração 400/800g","100% do peso = chocolate"],
                  ["Ovo Fatia 700g","6 fatias × 70g = 420g"],
                  ["Ovo de Colher 500g","50% = 250g de chocolate"],
                  ["Ovo Frito 60g","60g de chocolate"],
                  ["Ovo Tablet 120g","120g de chocolate"],
                  ["Misto","metade Ao Leite + metade Branco"],
                ].map(([p,r],i)=>(
                  <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"6px 0",borderBottom:"1px solid #fce4ec"}}>
                    <span style={{fontSize:11,fontWeight:700,color:RE,minWidth:180}}>{p}</span>
                    <span style={{fontSize:11,color:"#888"}}>{r}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          );
        })()}

        {/* ============================================================ */}
        {/* ABA LUCRO / CUSTOS                                            */}
        {/* ============================================================ */}
        {view==="custos"&&(()=>{
          const corCat={"Matéria Prima":RE,"Embalagem":ROSA,"Operacional":AM,"Outros":"#888"};
          const bgCat={"Matéria Prima":RC,"Embalagem":"#fff0f5","Operacional":"#fffbe6","Outros":"#f5f5f5"};
          const totalCustosCat=CATS_CUSTO.reduce((acc,cat)=>{acc[cat]=custos.filter(c=>c.cat===cat).reduce((s,c)=>s+(c.valor||0),0);return acc;},{});
          const maxCat=Math.max(...Object.values(totalCustosCat),1);
          const receitaPorMes=orders.reduce((acc,o)=>{
            if(!o.pago&&!o.pagoParcial)return acc;
            const mes=o.data_retirada?o.data_retirada.slice(0,7):"?";
            if(!acc[mes])acc[mes]={mes,receita:0};
            acc[mes].receita+=o.pago?(o.valor||0)+(o.frete||0):(o.entrada||0);
            return acc;
          },{});
          const mesesData=Object.values(receitaPorMes).sort((a,b)=>a.mes>b.mes?1:-1).map(d=>({...d,label:d.mes==="?"?"?":new Date(d.mes+"-01").toLocaleDateString("pt-BR",{month:"short",year:"2-digit"})}));
          const maxReceita=Math.max(...mesesData.map(d=>d.receita),totalCustos,1);
          return(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
              <div>
                <h2 style={{margin:0,fontSize:20,color:RE}}>💹 Custos & Lucro Real</h2>
                <p style={{margin:"4px 0 0",fontSize:12,color:"#aaa"}}>Preencha seus custos livremente — o lucro é calculado automaticamente</p>
              </div>
              <div style={{background:lucroReal>=0?"#eaf5f1":"#fff0f0",borderRadius:14,padding:"12px 20px",border:`2px solid ${lucroReal>=0?VE:"#e05555"}`,textAlign:"center"}}>
                <div style={{fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>{lucroReal>=0?"✅ Lucro Real":"⚠️ Prejuízo"}</div>
                <div style={{fontSize:28,fontWeight:700,color:lucroReal>=0?VE:"#e05555",lineHeight:1}}>{fmt(Math.abs(lucroReal))}</div>
                <div style={{fontSize:12,fontWeight:700,color:lucroReal>=0?VE:"#e05555",marginTop:2}}>{margemLucro>=0?"+":""}{margemLucro.toFixed(1)}% margem</div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12,marginBottom:22}}>
              {[
                {l:"💰 Receita recebida",v:fmt(totalRecebido),c:VE,bg:"#eaf5f1",sub:"pagamentos confirmados"},
                {l:"🔴 Total de custos",v:fmt(totalCustos),c:"#e05555",bg:"#fff0f0",sub:"soma dos seus gastos"},
                {l:lucroReal>=0?"✅ Lucro líquido":"⚠️ Prejuízo",v:fmt(Math.abs(lucroReal)),c:lucroReal>=0?VE:"#e05555",bg:lucroReal>=0?"#eaf5f1":"#fff0f0",sub:lucroReal>=0?"você está no positivo!":"atenção: no negativo"},
                {l:"📊 Margem",v:(margemLucro>=0?"+":"")+margemLucro.toFixed(1)+"%",c:margemLucro>=30?VE:margemLucro>=10?AM:"#e05555",bg:margemLucro>=30?"#eaf5f1":margemLucro>=10?"#fffbe6":"#fff0f0",sub:margemLucro>=30?"ótima!":margemLucro>=10?"razoável":"baixa"},
              ].map((c,i)=>(<div key={i} style={{background:c.bg,borderRadius:14,padding:"16px",borderLeft:`4px solid ${c.c}`}}><div style={{fontSize:10,color:"#aaa",fontWeight:700,marginBottom:4}}>{c.l}</div><div style={{fontSize:22,fontWeight:700,color:c.c,lineHeight:1}}>{c.v}</div><div style={{fontSize:10,color:"#bbb",marginTop:4}}>{c.sub}</div></div>))}
            </div>
            {(totalRecebido>0||totalCustos>0)&&(
              <div style={{background:"#fff",borderRadius:16,padding:"18px 20px",marginBottom:18,boxShadow:"0 2px 12px rgba(180,48,74,.07)"}}>
                <div style={{fontWeight:700,fontSize:13,color:RE,marginBottom:14}}>📊 Receita vs Custos vs Lucro</div>
                {[
                  {l:"💰 Receita recebida",v:totalRecebido,c:VE},
                  {l:"🔴 Total de custos",v:totalCustos,c:"#e05555"},
                  {l:lucroReal>=0?"✅ Lucro líquido":"⚠️ Prejuízo",v:Math.abs(lucroReal),c:lucroReal>=0?VE:"#e05555"},
                ].map((b,i)=>(
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
                      <span style={{color:"#555",fontWeight:600}}>{b.l}</span>
                      <span style={{fontWeight:700,color:b.c}}>{fmt(b.v)}</span>
                    </div>
                    <div style={{height:22,borderRadius:6,background:"#f5f5f5",overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:6,width:Math.max(2,b.v/Math.max(totalRecebido,totalCustos)*100)+"%",background:b.c,transition:"width .5s",display:"flex",alignItems:"center",paddingLeft:8}}>
                        {b.v>0&&<span style={{fontSize:10,color:"#fff",fontWeight:700,whiteSpace:"nowrap"}}>{Math.round(b.v/Math.max(totalRecebido,totalCustos)*100)}%</span>}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {mesesData.length>0&&(
              <div style={{background:"#fff",borderRadius:16,padding:"18px 20px",marginBottom:18,boxShadow:"0 2px 12px rgba(180,48,74,.07)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:6}}>
                  <div style={{fontWeight:700,fontSize:13,color:RE}}>📅 Receita por período</div>
                  <div style={{fontSize:11,color:"#aaa"}}>— linha vermelha = total de custos</div>
                </div>
                <div style={{display:"flex",alignItems:"flex-end",gap:8,height:130,paddingBottom:22,position:"relative",overflowX:"auto"}}>
                  {totalCustos>0&&<div style={{position:"absolute",bottom:22+(totalCustos/maxReceita*100)+"px",left:0,right:0,borderTop:"2px dashed #e05555",zIndex:1}}><span style={{position:"absolute",right:0,top:-16,fontSize:9,color:"#e05555",fontWeight:700,background:"#fff",padding:"1px 4px",borderRadius:4}}>custos {fmt(totalCustos)}</span></div>}
                  {mesesData.map((d,i)=>(
                    <div key={i} style={{flex:"0 0 auto",minWidth:48,display:"flex",flexDirection:"column",alignItems:"center",gap:4,position:"relative",zIndex:2}}>
                      <div style={{fontSize:9,color:RE,fontWeight:700,textAlign:"center"}}>{fmt(d.receita).replace("R$ ","")}</div>
                      <div style={{width:"100%",borderRadius:"4px 4px 0 0",background:d.receita>=(totalCustos||0)?VE:AM,height:Math.max(4,d.receita/maxReceita*100)+"px",transition:"height .4s",minWidth:36}}/>
                      <div style={{fontSize:9,color:"#aaa",textAlign:"center",position:"absolute",bottom:-18,whiteSpace:"nowrap"}}>{d.label}</div>
                    </div>

                </div>
                <div style={{display:"flex",gap:14,marginTop:6,fontSize:11,flexWrap:"wrap"}}>
                  <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:10,height:10,borderRadius:2,background:VE,display:"inline-block"}}/> Acima dos custos</span>
                  <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:10,height:10,borderRadius:2,background:AM,display:"inline-block"}}/> Abaixo dos custos</span>
                </div>
              </div>
            )}
            <div style={{background:"#fff",borderRadius:16,overflow:"hidden",marginBottom:18,boxShadow:"0 2px 12px rgba(180,48,74,.07)"}}>
              <div style={{background:`linear-gradient(135deg,${RE},${ROSA})`,padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{color:"#fff",fontWeight:700,fontSize:14}}>📋 Meus Custos</span>
                <span style={{color:"rgba(255,255,255,.8)",fontSize:12}}>{custos.length} item(ns) · {fmt(totalCustos)}</span>
              </div>
              {custos.map((c,i)=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",borderBottom:"1px solid #fce4ec",background:i%2===0?"#fff":"#fdf9fb"}}>
                  <input value={c.nome} onChange={e=>updCusto(c.id,"nome",e.target.value)} style={{flex:1,border:"none",background:"transparent",fontSize:13,color:"#444",outline:"none",fontWeight:500,minWidth:120}}/>
                  <select value={c.cat} onChange={e=>updCusto(c.id,"cat",e.target.value)} style={{padding:"4px 8px",borderRadius:8,border:`1.5px solid ${corCat[c.cat]||"#ccc"}`,background:bgCat[c.cat]||"#f5f5f5",color:corCat[c.cat]||"#888",fontSize:10,fontWeight:700,outline:"none",cursor:"pointer"}}>
                    {CATS_CUSTO.map(ct=><option key={ct} value={ct}>{ct}</option>)}
                  </select>
                  <div style={{display:"flex",alignItems:"center",gap:4,background:RC,borderRadius:9,padding:"6px 11px",border:`1.5px solid ${RM}`,minWidth:120}}>
                    <span style={{fontSize:11,color:"#aaa"}}>R$</span>
                    <input type="number" step="0.01" min="0" value={c.valor||""} onChange={e=>updCusto(c.id,"valor",e.target.value)} placeholder="0,00" style={{width:80,border:"none",background:"transparent",fontSize:14,fontWeight:700,color:RE,outline:"none",textAlign:"right"}}/>
                  </div>
                  <button onClick={()=>delCusto(c.id)} style={{padding:"5px 8px",borderRadius:8,border:"1.5px solid #ffd0cc",background:"#fff5f4",color:"#e07070",fontSize:13,cursor:"pointer"}}>🗑️</button>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px",background:`linear-gradient(135deg,${RC},#fff8f4)`,borderTop:`2px solid ${RM}`}}>
                <span style={{fontWeight:700,fontSize:13,color:RE}}>TOTAL DE CUSTOS</span>
                <span style={{fontWeight:700,fontSize:18,color:"#e05555"}}>{fmt(totalCustos)}</span>
              </div>
            </div>
            <div style={{background:"#fff",borderRadius:16,padding:"18px 20px",marginBottom:18,border:`2px dashed ${RM}`}}>
              <div style={{fontWeight:700,fontSize:13,color:RE,marginBottom:12}}>➕ Adicionar custo</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                <div style={{flex:2,minWidth:180}}>
                  <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Descrição</label>
                  <input value={custoNovo.nome} onChange={e=>setCustoNovo(p=>({...p,nome:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addCusto()} placeholder="Ex: Papel kraft, gás, etc..." style={{width:"100%",padding:"10px 13px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                </div>
                <div style={{flex:1,minWidth:140}}>
                  <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Categoria</label>
                  <select value={custoNovo.cat} onChange={e=>setCustoNovo(p=>({...p,cat:e.target.value}))} style={{width:"100%",padding:"10px 13px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:13,outline:"none",background:"#fff",boxSizing:"border-box"}}>
                    {CATS_CUSTO.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div style={{flex:1,minWidth:130}}>
                  <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Valor (R$)</label>
                  <div style={{display:"flex",alignItems:"center",gap:4,padding:"10px 12px",borderRadius:10,border:`1.5px solid ${AM}`,background:"#fffbe6",boxSizing:"border-box"}}>
                    <span style={{fontSize:11,color:AM}}>R$</span>
                    <input type="number" step="0.01" min="0" value={custoNovo.valor} onChange={e=>setCustoNovo(p=>({...p,valor:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addCusto()} placeholder="0,00" style={{flex:1,border:"none",background:"transparent",fontSize:14,fontWeight:700,color:AM,outline:"none"}}/>
                  </div>
                </div>
                <button onClick={addCusto} disabled={!custoNovo.nome.trim()||!custoNovo.valor} style={{padding:"10px 20px",borderRadius:10,border:"none",background:custoNovo.nome.trim()&&custoNovo.valor?`linear-gradient(135deg,${RE},${ROSA})`:"#ccc",color:"#fff",fontSize:13,fontWeight:700,cursor:custoNovo.nome.trim()&&custoNovo.valor?"pointer":"not-allowed",whiteSpace:"nowrap",alignSelf:"flex-end"}}>✅ Adicionar</button>
              </div>
            </div>
            <div style={{background:"#fff",borderRadius:16,padding:"18px 20px",boxShadow:"0 2px 12px rgba(180,48,74,.07)"}}>
              <div style={{fontWeight:700,fontSize:13,color:RE,marginBottom:14}}>🗂️ Distribuição por categoria</div>
              {CATS_CUSTO.map(cat=>{
                const val=totalCustosCat[cat]||0;
                if(!val)return null;
                return(
                  <div key={cat} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5}}>
                      <span style={{fontWeight:700,color:corCat[cat]}}>{cat}</span>
                      <span style={{fontWeight:700,color:corCat[cat]}}>{fmt(val)} <span style={{color:"#bbb",fontWeight:400}}>({totalCustos>0?Math.round(val/totalCustos*100):0}%)</span></span>
                    </div>
                    <div style={{height:10,borderRadius:5,background:"#f0dde4",overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:5,width:(val/maxCat*100)+"%",background:corCat[cat],transition:"width .4s"}}/>
                    </div>
                  </div>
                );
              })}
              {totalCustos===0&&<div style={{textAlign:"center",padding:"20px 0",color:"#ccc",fontSize:13}}>Preencha os valores acima para ver a distribuição</div>}
              {totalCustos>0&&(<div style={{display:"flex",justifyContent:"space-between",paddingTop:12,borderTop:`1.5px solid ${RM}`,marginTop:8,fontSize:14}}><span style={{fontWeight:700,color:"#555"}}>Total de Custos</span><span style={{fontWeight:700,color:"#e05555"}}>{fmt(totalCustos)}</span></div>)}
            </div>
          </div>
          );
        })()}

        {view==="whatsapp"&&<WhatsAppPage onSave={saveOrder}/>}
        {view==="precos"&&<PrecosPage cardapio={cardapio} precos={precos} setPrecos={setPrecos} extrasCardapio={extrasCardapio} setExtrasCardapio={setExtrasCardapio} acessoriosBase={acessoriosBase} setAcessoriosBase={setAcessoriosBase}/>}

        {view==="dashboard"&&(<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(175px,1fr))",gap:14,marginBottom:24}}>
            {[{label:"Em Aberto",value:totalPendentes,icon:"⏳",color:"#e8b86d",bg:"#fdf6e3"},{label:"Prontos",value:totalProntos,icon:"✅",color:VE,bg:"#eaf5f1"},{label:"Recebido",value:fmt(totalRecebido),icon:"💰",color:VE,bg:"#eaf5f1"},{label:"A Receber",value:fmt(totalAReceber),icon:"⚠️",color:RE,bg:RC},{label:"Total",value:orders.length,icon:"🎂",color:ROSA,bg:"#fff0f5"}].map((c,i)=>(<div key={i} style={{background:c.bg,borderRadius:16,padding:"18px 16px",borderLeft:`4px solid ${c.color}`}}><div style={{fontSize:22}}>{c.icon}</div><div style={{fontSize:20,fontWeight:"bold",color:c.color,marginTop:4}}>{c.value}</div><div style={{fontSize:11,color:"#aaa",marginTop:2}}>{c.label}</div></div>))}
            {/* Card de frete */}
            {freteTotal>0&&(
              <div style={{background:"#fffbe6",borderRadius:16,padding:"18px 16px",borderLeft:`4px solid ${AM}`,gridColumn:"span 1"}}>
                <div style={{fontSize:22}}>🚚</div>
                <div style={{fontSize:20,fontWeight:"bold",color:AM,marginTop:4}}>{fmt(freteTotal)}</div>
                <div style={{fontSize:11,color:"#aaa",marginTop:2}}>Total em Fretes</div>
                <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:4}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                    <span style={{color:"#888"}}>✅ Entregue</span>
                    <span style={{fontWeight:700,color:VE}}>{fmt(freteEntregue)}</span>
                  </div>
                  <div style={{height:4,borderRadius:2,background:"#f0e0a0",overflow:"hidden"}}>
                    <div style={{height:"100%",borderRadius:2,width:(freteTotal>0?freteEntregue/freteTotal*100:0)+"%",background:VE,transition:"width .4s"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                    <span style={{color:"#888"}}>⏳ Pendente</span>
                    <span style={{fontWeight:700,color:fretePendente>0?AM:"#aaa"}}>{fmt(fretePendente)}</span>
                  </div>
                  <div style={{marginTop:6,padding:"5px 8px",background:"#fff",borderRadius:8,border:`1px solid ${AM}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#888"}}>🚚 Pedidos c/ frete</span>
                    <span style={{fontWeight:700,fontSize:13,color:AM}}>{freteQtdEntregue}<span style={{color:"#bbb",fontWeight:400}}>/{freteQtdTotal}</span></span>
                  </div>
                </div>
              </div>
            )}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:18}}>
            {[{t:"🏆 Qtd. por Produto",c:<ResponsiveContainer width="100%" height={340}><BarChart data={prodData} layout="vertical" margin={{left:0,right:16}}><XAxis type="number" tick={{fontSize:10}}/><YAxis type="category" dataKey="name" tick={{fontSize:9}} width={150}/><Tooltip formatter={v=>[`${v} unid.`]}/><Bar dataKey="qty" radius={[0,8,8,0]}>{prodData.map((_,i)=><Cell key={i} fill={PAL[i%PAL.length]}/>)}</Bar></BarChart></ResponsiveContainer>},{t:"📌 Status",c:<ResponsiveContainer width="100%" height={200}><PieChart><Pie data={stData} cx="50%" cy="50%" innerRadius={50} outerRadius={85} paddingAngle={4} dataKey="value" label={({name,value})=>`${name}: ${value}`} labelLine={false}>{stData.map((d,i)=><Cell key={i} fill={d.color}/>)}</Pie><Tooltip/></PieChart></ResponsiveContainer>},{t:"📈 Faturamento por Mês",c:<ResponsiveContainer width="100%" height={200}><BarChart data={fatData}><CartesianGrid strokeDasharray="3 3" stroke="#fce4ec"/><XAxis dataKey="mes" tick={{fontSize:11}}/><YAxis tick={{fontSize:11}} tickFormatter={v=>`R$${v}`}/><Tooltip formatter={(v,n)=>[fmt(v),n==="recebido"?"Recebido":"A Receber"]}/><Legend formatter={v=>v==="recebido"?"Recebido":"A Receber"}/><Bar dataKey="recebido" fill={VE} radius={[6,6,0,0]}/><Bar dataKey="aReceber" fill={AM} radius={[6,6,0,0]}/></BarChart></ResponsiveContainer>},{t:"💵 Receita por Produto",c:<ResponsiveContainer width="100%" height={340}><BarChart data={valData} layout="vertical" margin={{left:0,right:16}}><XAxis type="number" tick={{fontSize:10}} tickFormatter={v=>`R$${v}`}/><YAxis type="category" dataKey="name" tick={{fontSize:9}} width={150}/><Tooltip formatter={v=>[fmt(v)]}/><Bar dataKey="total" radius={[0,8,8,0]}>{valData.map((_,i)=><Cell key={i} fill={PAL[i%PAL.length]}/>)}</Bar></BarChart></ResponsiveContainer>}].map((c,i)=>(<div key={i} style={{background:"#fff",borderRadius:18,padding:20,boxShadow:"0 2px 14px rgba(180,48,74,.07)"}}><h3 style={{margin:"0 0 14px",fontSize:14,color:RE}}>{c.t}</h3>{c.c}</div>))}
          </div>
          <div style={{background:"#fff",borderRadius:18,padding:20}}><h3 style={{margin:"0 0 14px",fontSize:14,color:RE}}>📅 Próximas Entregas</h3>{orders.filter(o=>o.status!=="entregue"&&o.data_retirada).sort((a,b)=>a.data_retirada>b.data_retirada?1:-1).slice(0,6).length===0?<div style={{color:"#ccc",fontSize:13}}>Nenhuma agendada</div>:orders.filter(o=>o.status!=="entregue"&&o.data_retirada).sort((a,b)=>a.data_retirada>b.data_retirada?1:-1).slice(0,6).map(o=>{const prazo=getPrazo(getDias(o.data_retirada,agora),o.status);const bp=getBadge(o);return(<div key={o.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #fce4ec",flexWrap:"wrap"}}><span style={{fontSize:18}}>{ST[o.status]?.icon}</span><div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{o.cliente}</div><div style={{fontSize:11,color:"#aaa"}}>{o.itens}</div></div><div style={{fontSize:12,color:RE,fontWeight:700}}>{new Date(o.data_retirada+"T12:00").toLocaleDateString("pt-BR")}</div>{prazo&&<span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:prazo.bg,color:prazo.color}}>{prazo.icon} {prazo.label}</span>}<span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:bp.bg,color:bp.color}}>{bp.text}</span></div>);})}</div>
        </>)}

        {view==="cardapio"&&(<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
            <div><h2 style={{margin:0,fontSize:20,color:RE}}>🍫 Cardápio — Produção Diária</h2><p style={{margin:"4px 0 0",fontSize:12,color:"#aaa"}}>Produtos artesanais com qualidade premium</p></div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{cats.map(c=><button key={c} onClick={()=>setCatFiltro(c)} style={{padding:"5px 12px",borderRadius:20,border:"2px solid",borderColor:catFiltro===c?RE:"#f0dde4",background:catFiltro===c?RE:"#fff",color:catFiltro===c?"#fff":"#888",fontSize:11,fontWeight:700,cursor:"pointer"}}>{c}</button>)}</div>
          </div>
          {cats.filter(c=>c!=="Todas"&&(catFiltro==="Todas"||catFiltro===c)).map(cat=>{const items=cardapio.filter(p=>p.cat===cat);return(<div key={cat} style={{background:"#fff",borderRadius:16,marginBottom:14,overflow:"hidden"}}><div style={{background:`linear-gradient(135deg,${RE},${ROSA})`,padding:"11px 18px"}}><span style={{color:"#fff",fontWeight:700,fontSize:14}}>{cat}</span></div>{items.map((p,i)=>(<div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 18px",borderBottom:i<items.length-1?"1px solid #fce4ec":"none",gap:12}}><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{p.nome}</div>{p.obs&&<div style={{fontSize:11,color:"#aaa"}}>{p.obs}</div>}</div><span style={{fontSize:15,fontWeight:700,color:RE}}>{fmt(p.preco)}</span></div>))}</div>);})}
        </>)}

        {view==="pedidos"&&(<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
            <h2 style={{margin:0,fontSize:20,color:RE}}>📋 Pedidos</h2>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={()=>setShowFiltros(v=>!v)} style={{padding:"9px 14px",borderRadius:22,border:`2px solid ${filtrosAtivos?RE:RM}`,background:filtrosAtivos?RC:"#fff",color:filtrosAtivos?RE:"#aaa",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔍 Filtros{filtrosAtivos?" ●":""}</button>
              <button onClick={()=>setView("whatsapp")} style={{padding:"9px 14px",borderRadius:22,border:"2px solid #25d366",background:"#f0fdf4",color:"#25d366",fontSize:12,fontWeight:700,cursor:"pointer"}}>💬 WhatsApp</button>
              <button onClick={()=>setForm({})} style={{padding:"9px 20px",borderRadius:22,border:"none",background:`linear-gradient(135deg,${RE},${ROSA})`,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Novo Pedido</button>
            </div>
          </div>
          {showFiltros&&(<div style={{background:"#fff",borderRadius:16,padding:18,marginBottom:16,border:`1.5px solid ${RM}`}}><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:12}}><div><label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>📅 Mês</label><select value={filtroMes} onChange={e=>setFiltroMes(e.target.value)} style={{width:"100%",padding:"8px 10px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:12,outline:"none"}}><option value="">Todos</option>{mesesDisp.map(m=><option key={m} value={m}>{new Date(m+"-01").toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</option>)}</select></div><div><label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>💵 Valor Mín</label><input type="number" value={filtroValMin} onChange={e=>setFiltroValMin(e.target.value)} placeholder="Ex: 50" style={{width:"100%",padding:"8px 10px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:12,outline:"none",boxSizing:"border-box"}}/></div><div><label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>💵 Valor Máx</label><input type="number" value={filtroValMax} onChange={e=>setFiltroValMax(e.target.value)} placeholder="Ex: 300" style={{width:"100%",padding:"8px 10px",borderRadius:10,border:`1.5px solid ${RM}`,fontSize:12,outline:"none",boxSizing:"border-box"}}/></div><div><label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>💳 Pagamento</label><div style={{display:"flex",gap:5}}>{[["todos","Todos"],["pago","✅"],["nao_pago","⏳"]].map(([k,l])=>(<button key={k} onClick={()=>setFiltroPago(k)} style={{flex:1,padding:"7px 4px",borderRadius:10,border:"1.5px solid",borderColor:filtroPago===k?RE:RM,background:filtroPago===k?RC:"#fff",color:filtroPago===k?RE:"#aaa",fontSize:11,fontWeight:700,cursor:"pointer"}}>{l}</button>))}</div></div></div>{filtrosAtivos&&(<div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${RC}`,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>{[{l:`${resumoF.total} pedidos`,i:"🎂",c:RE,b:RC},{l:`Rec: ${fmt(resumoF.recebido)}`,i:"💰",c:VE,b:"#eaf5f1"},{l:`A rec: ${fmt(resumoF.aReceber)}`,i:"⚠️",c:AM,b:"#fff8ec"},{l:`Total: ${fmt(resumoF.totalValor)}`,i:"📈",c:"#555",b:"#f5f5f5"}].map((x,i)=>(<div key={i} style={{padding:"6px 12px",borderRadius:10,background:x.b,color:x.c,fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:4}}><span>{x.i}</span><span>{x.l}</span></div>))}<button onClick={()=>{setFiltroMes("");setFiltroValMin("");setFiltroValMax("");setFiltroPago("todos");}} style={{marginLeft:"auto",padding:"6px 12px",borderRadius:20,border:`1.5px solid ${RM}`,background:"#fff",color:"#aaa",fontSize:11,cursor:"pointer"}}>🗑️ Limpar</button></div>)}</div>)}
          {duplicatas.ids.size>0&&(
            <div style={{background:"#fff8ec",border:"2px solid #e8a020",borderRadius:14,padding:"14px 16px",marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
                <span style={{fontSize:20}}>⚠️</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,color:"#c47a00",fontSize:13}}>Possíveis pedidos duplicados detectados!</div>
                  <div style={{fontSize:11,color:"#aaa",marginTop:1}}>{duplicatas.grupos.length} cliente(s) com mais de 1 pedido em aberto</div>
                </div>
                <button onClick={()=>{setBuscaPedido("");setFilter("todos");}} style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid #e8a020",background:"#fff",color:"#c47a00",fontSize:11,fontWeight:700,cursor:"pointer"}}>Ver todos</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {duplicatas.grupos.map((g,gi)=>(
                  <div key={gi} style={{background:"#fff",borderRadius:10,padding:"10px 12px",border:"1px solid #f5d78a"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:6}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:14}}>👤</span>
                        <span style={{fontWeight:700,fontSize:13,color:"#c47a00"}}>{g.nome}</span>
                        <span style={{padding:"1px 8px",borderRadius:20,background:"#fde8a0",color:"#c47a00",fontSize:10,fontWeight:700}}>{g.pedidos.length} pedidos</span>
                      </div>
                      <button onClick={()=>setBuscaPedido(g.nome)} style={{padding:"4px 12px",borderRadius:20,border:"1.5px solid #e8a020",background:"#fffbe6",color:"#c47a00",fontSize:11,fontWeight:700,cursor:"pointer"}}>🔍 Filtrar este cliente</button>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      {g.pedidos.map((o,oi)=>{
                        const bp=getBadge(o);
                        const st=ST[o.status]||ST.pendente;
                        const dt=o.data_retirada?new Date(o.data_retirada+"T12:00").toLocaleDateString("pt-BR"):"sem data";
                        return(
                          <div key={oi} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:8,background:"#fffbe6",flexWrap:"wrap",cursor:"pointer"}} onClick={()=>setBuscaPedido(g.nome)}>
                            <span style={{fontSize:12}}>{st.icon}</span>
                            <span style={{fontSize:11,color:"#888",minWidth:24}}>#{o.id}</span>
                            <span style={{fontSize:11,flex:1,color:"#555",fontWeight:500}}>{o.itens||"—"}</span>
                            <span style={{fontSize:11,color:RE,fontWeight:700}}>{fmt((o.valor||0)+(o.frete||0))}</span>
                            <span style={{fontSize:10,color:"#aaa"}}>📅 {dt}</span>
                            <span style={{padding:"1px 7px",borderRadius:20,fontSize:10,fontWeight:700,background:bp.bg,color:bp.color}}>{bp.text}</span>
                            <span style={{padding:"1px 7px",borderRadius:20,fontSize:10,fontWeight:700,background:st.bg,color:st.color}}>{st.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{marginBottom:10,position:"relative"}}>
            <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:15,color:"#ccc",pointerEvents:"none"}}>🔍</span>
            <input value={buscaPedido} onChange={e=>setBuscaPedido(e.target.value)} placeholder="Buscar por nome, telefone ou produto..." style={{width:"100%",padding:"10px 14px 10px 40px",borderRadius:12,border:`1.5px solid ${buscaPedido?RE:RM}`,fontSize:13,outline:"none",boxSizing:"border-box",background:"#fff",transition:"border-color .2s"}}/>
            {buscaPedido&&<button onClick={()=>setBuscaPedido("")} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:16,color:"#ccc",cursor:"pointer"}}>✕</button>}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
            {[["todos","Todos"],...Object.entries(ST).map(([k,v])=>[k,`${v.icon} ${v.label}`])].map(([k,l])=>(<button key={k} onClick={()=>setFilter(k)} style={{padding:"6px 13px",borderRadius:20,border:"2px solid",borderColor:filter===k?RE:"#f0dde4",background:filter===k?RE:"#fff",color:filter===k?"#fff":"#888",fontSize:12,fontWeight:700,cursor:"pointer"}}>{l}</button>))}
            <span style={{fontSize:12,color:"#aaa"}}>{lista.length} pedido(s){buscaPedido&&` para "${buscaPedido}"`}</span>
          </div>
          {lista.length===0?(<div style={{textAlign:"center",padding:"60px 0",color:"#ccc"}}><div style={{fontSize:52}}>🥚</div><div style={{marginTop:10,fontSize:15}}>Nenhum pedido ainda</div><button onClick={()=>setForm({})} style={{marginTop:14,padding:"9px 22px",borderRadius:22,border:"none",background:`linear-gradient(135deg,${RE},${ROSA})`,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Criar primeiro pedido</button></div>):(
            <div style={{display:"grid",gap:12}}>
              <div style={{background:"#fff",borderRadius:12,padding:"10px 16px",border:`1.5px solid ${RM}`,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><span style={{fontSize:13}}>📌</span><span style={{fontSize:12,color:"#888"}}>Fila por urgência</span><div style={{display:"flex",gap:6,flexWrap:"wrap",marginLeft:"auto"}}>{[{c:"#e05555",b:"#fff0f0",l:"Atrasado"},{c:"#e07020",b:"#fff5e0",l:"Hoje"},{c:AM,b:"#fffbe6",l:"Amanhã"},{c:ROSA,b:RC,l:"Em breve"}].map((x,i)=>(<span key={i} style={{padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700,background:x.b,color:x.c}}>{x.l}</span>))}</div></div>
              {lista.map(o=>(<PedidoCard key={o.id} o={o} idx={naoEnt.indexOf(o)} agora={agora} isDuplicata={duplicatas.ids.has(o.id)} onStatus={updSt} onPagto={(tipo,val)=>updPag(o.id,tipo,val)} onEdit={setForm} onDelete={delOrder}/>))}
            </div>
          )}
        </>)}
      </main>

      {showGerenciar&&<GerenciarUsuarios onClose={()=>setShowGerenciar(false)}/>}
      {form!==null&&<FormModal initial={form} onSave={saveOrder} onClose={()=>setForm(null)} cardapio={cardapio} acessorios={acessoriosBase}/>}
      {toast&&<div style={{position:"fixed",bottom:24,right:24,padding:"12px 20px",borderRadius:12,background:toast.type==="err"?"#e07070":RE,color:"#fff",fontSize:14,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.15)",zIndex:999}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
